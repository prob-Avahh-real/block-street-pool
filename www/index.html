<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>方块街头桌球</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --dirt:#8B5A2B;--dirt-dark:#5C3A1A;--grass:#5D9B3E;--grass-dark:#3D6B28;
  --stone:#7A7A7A;--stone-dark:#4A4A4A;--felt:#2E6B2E;--felt-dark:#1A4A1A;
  --gold:#F4C430;--sky-top:#1a1a2e;--sky-bot:#16213e;
  --ui-bg:#C6C6C6;--ui-dark:#373737;--ui-mid:#8B8B8B;--ui-light:#FFFFFF;
  --slot:#8B8B8B;--hp:#55FF55;
}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:'Press Start 2P',monospace;background:var(--sky-top);color:#fff;image-rendering:pixelated}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}

/* Minecraft-style panels */
.mc-panel{
  background:var(--ui-bg);border:4px solid;border-color:var(--ui-light) var(--ui-dark) var(--ui-dark) var(--ui-light);
  box-shadow:inset -2px -2px 0 var(--ui-mid),inset 2px 2px 0 #E0E0E0;color:var(--ui-dark);
}
.mc-btn{
  font-family:'Press Start 2P',monospace;font-size:10px;padding:12px 20px;cursor:pointer;
  background:linear-gradient(#C6C6C6,#8B8B8B);border:3px solid;
  border-color:#FFFFFF #373737 #373737 #FFFFFF;color:#202020;text-shadow:1px 1px 0 #E0E0E0;
}
.mc-btn:active{border-color:#373737 #FFFFFF #FFFFFF #373737;background:linear-gradient(#8B8B8B,#6B6B6B);transform:translateY(1px)}
.mc-btn.primary{background:linear-gradient(#5D9B3E,#3D6B28);color:#fff;text-shadow:1px 1px 0 #1A3A10;
  border-color:#8FCF6A #2A4A18 #2A4A18 #8FCF6A}

#start-screen,#result{
  position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(26,26,46,.94),rgba(22,33,62,.96));gap:14px;padding:16px;
}
#start-screen h1,#result h2{
  font-size:clamp(14px,4.5vw,22px);color:var(--gold);text-shadow:3px 3px 0 #5C3A1A,-1px -1px 0 #000;
  letter-spacing:1px;text-align:center;line-height:1.5
}
#start-screen .sub{font-size:8px;color:#A0A0A0;text-align:center;line-height:1.8;max-width:280px}
#start-screen .tips{font-size:7px;color:#707070;line-height:1.9;text-align:center;max-width:300px}
#result{display:none}#result.show{display:flex}
#result .stats{display:flex;gap:20px;margin:8px 0}
#result .sv{font-size:14px;color:var(--gold);text-align:center}
#result .sl{font-size:7px;color:#888;margin-top:6px}

#hud{
  position:absolute;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;padding:0 0 max(6px,env(safe-area-inset-bottom));
}
#hotbar{
  display:flex;gap:2px;padding:4px;background:rgba(0,0,0,.55);
  border:3px solid;border-color:#555 #111 #111 #555;
}
.slot{
  width:36px;height:36px;background:rgba(139,139,139,.35);
  border:2px solid;border-color:#373737 #C6C6C6 #C6C6C6 #373737;
  display:flex;align-items:center;justify-content:center;position:relative;image-rendering:pixelated;
}
.slot.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.slot .n{position:absolute;right:2px;bottom:1px;font-size:7px;color:#fff;text-shadow:1px 1px 0 #000}
.slot .ball-icon{width:18px;height:18px;border-radius:2px;border:1px solid rgba(0,0,0,.4)}

#topbar{
  position:absolute;top:0;left:0;right:0;z-index:20;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:max(8px,env(safe-area-inset-top)) 10px 0;
}
#topbar .box{
  background:rgba(0,0,0,.55);border:2px solid #555;padding:6px 8px;min-width:72px;
}
#topbar .lbl{font-size:6px;color:#888;margin-bottom:4px}
#topbar .val{font-size:10px;color:#fff}
#xp-bar{
  position:absolute;top:max(42px,calc(env(safe-area-inset-top) + 34px));left:50%;transform:translateX(-50%);
  z-index:20;width:min(220px,70vw);height:8px;background:#373737;border:2px solid #111;
  pointer-events:none;
}
#xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#55FF55,#3DCF3D);image-rendering:pixelated;
  transition:width .15s linear}
#xp-label{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:6px;color:#55FF55;white-space:nowrap}

#aim-hint{
  position:absolute;bottom:56px;left:50%;transform:translateX(-50%);z-index:22;
  font-size:7px;color:#CFCFCF;background:rgba(0,0,0,.5);padding:6px 10px;border:1px solid #444;
  pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;
}
#aim-hint.show{opacity:1}

#power-rail{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:22;
  width:14px;height:120px;background:#373737;border:2px solid #111;pointer-events:none;opacity:0;
}
#power-rail.show{opacity:1}
#power-fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(0deg,#F4C430,#FF5555)}

#view-toggle{
  position:fixed;left:8px;z-index:50;font-size:6px;padding:6px 8px;cursor:pointer;pointer-events:auto;
  top:max(70px,calc(env(safe-area-inset-top) + 58px));
  background:rgba(0,0,0,.65);border:2px solid #555;color:#CFCFCF;font-family:'Press Start 2P',monospace;
}
#view-toggle.fps{border-color:var(--gold);color:var(--gold)}

#crosshair{
  position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:18;pointer-events:none;
  width:18px;height:18px;opacity:0;
}
#crosshair.show{opacity:.85}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;box-shadow:1px 1px 0 #000}
#crosshair::before{left:8px;top:0;width:2px;height:18px}
#crosshair::after{left:0;top:8px;width:18px;height:2px}

#ring-badge,#cane-badge{
  position:fixed;right:8px;z-index:50;font-size:6px;padding:4px 6px;cursor:pointer;pointer-events:auto;
  background:rgba(0,0,0,.6);border:2px solid #555;color:#888;
}
#ring-badge{top:max(70px,calc(env(safe-area-inset-top) + 58px))}
#cane-badge{top:max(92px,calc(env(safe-area-inset-top) + 80px))}
#ring-badge.on,#cane-badge.on{color:#55FF55;border-color:#55FF55}

#scratch-msg{
  position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);z-index:30;
  font-size:10px;color:#FF5555;text-shadow:2px 2px 0 #000;opacity:0;pointer-events:none;
  transition:opacity .25s;white-space:nowrap;
}
#scratch-msg.show{opacity:1}

@media(max-width:280px),(max-height:300px){
  #start-screen h1,#result h2{font-size:10px}
  #start-screen .sub,#start-screen .tips{font-size:5px;max-width:140px}
  .mc-btn{font-size:6px;padding:6px 10px}
  .slot{width:22px;height:22px}.slot .ball-icon{width:10px;height:10px}.slot .n{font-size:5px}
  #topbar .box{padding:3px 4px;min-width:48px}#topbar .lbl{font-size:4px}#topbar .val{font-size:7px}
  #xp-bar{width:100px;height:5px;top:28px}#xp-label{font-size:4px}
  #power-rail{width:8px;height:60px;right:4px}
  #ring-badge,#cane-badge,#view-toggle{font-size:4px;padding:2px 3px}
  #aim-hint{font-size:5px;bottom:36px}
  #crosshair{width:12px;height:12px;top:40%}
  #crosshair::before{left:5px;width:2px;height:12px}
  #crosshair::after{top:5px;width:12px;height:2px}
}
@media(max-width:420px) and (max-height:340px),(max-width:340px) and (max-height:420px){
  #start-screen h1{font-size:12px}.mc-btn{font-size:7px;padding:8px 12px}
  .slot{width:28px;height:28px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start-screen">
  <h1>方块街头桌球</h1>
  <p class="sub">BLOCK STREET POOL</p>
  <p class="tips">拖拽瞄准蓄力 · 松手出杆<br>戒指倾斜瞄准 · 手杖甩动出杆<br>左上角切换 俯视 / 第一人称<br>清台进袋 · 别把母球打进洞</p>
  <button class="mc-btn primary" id="btn-start">开始对局</button>
  <button class="mc-btn" id="btn-practice">练习模式</button>
</div>

<div id="result">
  <h2 id="rtitle">清台完成!</h2>
  <div class="stats">
    <div><div class="sv" id="r-shots">0</div><div class="sl">出杆</div></div>
    <div><div class="sv" id="r-pockets">0</div><div class="sl">进袋</div></div>
    <div><div class="sv" id="r-score">0</div><div class="sl">得分</div></div>
  </div>
  <button class="mc-btn primary" id="btn-again">再来一局</button>
</div>

<div id="topbar">
  <div class="box"><div class="lbl">得分</div><div class="val" id="score">0</div></div>
  <div class="box" style="text-align:right"><div class="lbl">出杆</div><div class="val" id="shots">0</div></div>
</div>
<div id="xp-bar"><div id="xp-label">目标 · 清台</div><div id="xp-fill"></div></div>

<div id="power-rail"><div id="power-fill"></div></div>
<div id="aim-hint">拖拽瞄准 · 拉开蓄力</div>
<div id="scratch-msg">母球进袋!</div>
<div id="crosshair"></div>

<div id="hud">
  <div id="hotbar"></div>
</div>

<button id="view-toggle" type="button">视角 · 俯视</button>
<div id="ring-badge">戒指 · 点击启用</div>
<div id="cane-badge">手杖 · 点击启用</div>

<script type="module">
import { WearableInput } from './src/wearable-input.js';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ── Palette / constants ──────────────────────────────────
const BALL_R = 11;
const POCKET_R = 16;
const FRICTION = 0.988;
const MIN_V = 0.04;
const MAX_POWER = 18;
const CUSHION = 0.82;

const BALL_COLORS = [
  null,
  '#F4C430', '#2244CC', '#CC2222', '#7722AA', '#FF8800', '#228844', '#661111', '#111111',
  '#F4C430', '#2244CC', '#CC2222', '#7722AA', '#FF8800', '#228844', '#661111',
];

let W = 0, H = 0, dpr = 1;
let table = { x: 0, y: 0, w: 0, h: 0 };
let pockets = [];
let balls = [];
let cueBall = null;
let state = 'menu'; // menu | aiming | shooting | moving | placing | won
let mode = 'street'; // street | practice
let viewMode = 'top'; // top | fps
let aimAngle = 0;
let power = 0;
let dragging = false;
let dragStart = null;
let dragAim0 = 0;
let shots = 0, score = 0, pocketed = 0, totalObject = 15;
let scratchFlash = 0;
let wearAim = { x: 0, y: -1 };
let wearDrawing = false;
let wearPower = 0.4;
let fpsPitch = 0.42; // look-down angle in FPS

// ── Resize ───────────────────────────────────────────────
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layoutTable();
}
window.addEventListener('resize', resize);

function layoutTable() {
  const marginX = Math.max(18, W * 0.04);
  const marginTop = Math.max(70, H * 0.12);
  const marginBot = Math.max(64, H * 0.14);
  let tw = W - marginX * 2;
  let th = H - marginTop - marginBot;
  // Prefer classic ~2:1 pool ratio
  if (tw / th > 2.05) tw = th * 2;
  else if (tw / th < 1.55) th = tw / 1.8;
  table = {
    x: (W - tw) / 2,
    y: marginTop + (H - marginTop - marginBot - th) / 2,
    w: tw,
    h: th,
  };
  const px = table.x, py = table.y, pw = table.w, ph = table.h;
  pockets = [
    { x: px, y: py },
    { x: px + pw / 2, y: py },
    { x: px + pw, y: py },
    { x: px, y: py + ph },
    { x: px + pw / 2, y: py + ph },
    { x: px + pw, y: py + ph },
  ];
}

// ── Balls ────────────────────────────────────────────────
function makeBall(n, x, y) {
  return { n, x, y, vx: 0, vy: 0, r: BALL_R, pocketed: false, stripe: n > 8 };
}

function rackBalls() {
  balls = [];
  const cx = table.x + table.w * 0.68;
  const cy = table.y + table.h * 0.5;
  const gap = BALL_R * 2.05;
  // Standard triangle rack order (simplified)
  const order = [1, 9, 2, 10, 8, 11, 3, 12, 4, 13, 5, 14, 6, 15, 7];
  let idx = 0;
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col <= row; col++) {
      const x = cx + row * gap * Math.cos(Math.PI / 6);
      const y = cy + (col - row / 2) * gap;
      balls.push(makeBall(order[idx++], x, y));
    }
  }
  cueBall = makeBall(0, table.x + table.w * 0.28, table.y + table.h * 0.5);
  cueBall.stripe = false;
  balls.unshift(cueBall);
  totalObject = 15;
  pocketed = 0;
  shots = 0;
  score = 0;
  updateHUD();
  buildHotbar();
}

function ballsMoving() {
  return balls.some((b) => !b.pocketed && (Math.abs(b.vx) > MIN_V || Math.abs(b.vy) > MIN_V));
}

// ── Physics ──────────────────────────────────────────────
function stepPhysics() {
  for (const b of balls) {
    if (b.pocketed) continue;
    b.x += b.vx;
    b.y += b.vy;
    b.vx *= FRICTION;
    b.vy *= FRICTION;
    if (Math.abs(b.vx) < MIN_V) b.vx = 0;
    if (Math.abs(b.vy) < MIN_V) b.vy = 0;

    // Cushions
    if (b.x - b.r < table.x) { b.x = table.x + b.r; b.vx = Math.abs(b.vx) * CUSHION; }
    if (b.x + b.r > table.x + table.w) { b.x = table.x + table.w - b.r; b.vx = -Math.abs(b.vx) * CUSHION; }
    if (b.y - b.r < table.y) { b.y = table.y + b.r; b.vy = Math.abs(b.vy) * CUSHION; }
    if (b.y + b.r > table.y + table.h) { b.y = table.y + table.h - b.r; b.vy = -Math.abs(b.vy) * CUSHION; }
  }

  // Collisions
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      if (a.pocketed || b.pocketed) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const minD = a.r + b.r;
      if (dist < minD && dist > 0) {
        const nx = dx / dist, ny = dy / dist;
        const overlap = minD - dist;
        a.x -= nx * overlap * 0.5;
        a.y -= ny * overlap * 0.5;
        b.x += nx * overlap * 0.5;
        b.y += ny * overlap * 0.5;
        const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
        const vn = dvx * nx + dvy * ny;
        if (vn > 0) {
          a.vx -= vn * nx;
          a.vy -= vn * ny;
          b.vx += vn * nx;
          b.vy += vn * ny;
        }
      }
    }
  }

  // Pockets
  for (const b of balls) {
    if (b.pocketed) continue;
    for (const p of pockets) {
      if (Math.hypot(b.x - p.x, b.y - p.y) < POCKET_R * 0.85) {
        b.pocketed = true;
        b.vx = b.vy = 0;
        if (b.n === 0) {
          scratchFlash = 60;
          document.getElementById('scratch-msg').classList.add('show');
          setTimeout(() => document.getElementById('scratch-msg').classList.remove('show'), 1200);
          score = Math.max(0, score - 20);
        } else {
          pocketed++;
          score += 10 + (b.n === 8 ? 30 : 0);
        }
        updateHUD();
        buildHotbar();
      }
    }
  }
}

function placeCueBall(x, y) {
  const minX = table.x + BALL_R + 2;
  const maxX = table.x + table.w * 0.35;
  const minY = table.y + BALL_R + 2;
  const maxY = table.y + table.h - BALL_R - 2;
  cueBall.x = clamp(x, minX, maxX);
  cueBall.y = clamp(y, minY, maxY);
  cueBall.vx = cueBall.vy = 0;
  // Avoid overlap
  for (const b of balls) {
    if (b === cueBall || b.pocketed) continue;
    const d = Math.hypot(cueBall.x - b.x, cueBall.y - b.y);
    if (d < BALL_R * 2.1) {
      cueBall.x = table.x + table.w * 0.25;
      cueBall.y = table.y + table.h * 0.5;
    }
  }
  cueBall.pocketed = false;
}

function shoot(angle, pwr) {
  if (state !== 'aiming' && state !== 'placing') return;
  if (cueBall.pocketed) return;
  const p = clamp(pwr, 0.08, 1) * MAX_POWER;
  cueBall.vx = Math.cos(angle) * p;
  cueBall.vy = Math.sin(angle) * p;
  shots++;
  state = 'moving';
  dragging = false;
  power = 0;
  wearDrawing = false;
  document.getElementById('power-rail').classList.remove('show');
  document.getElementById('aim-hint').classList.remove('show');
  updateHUD();
}

// ── Drawing (Minecraft vibe) ─────────────────────────────
function drawBlock(x, y, s, c1, c2, c3) {
  ctx.fillStyle = c1;
  ctx.fillRect(x, y, s, s);
  ctx.fillStyle = c2;
  ctx.fillRect(x, y, s, 2);
  ctx.fillRect(x, y, 2, s);
  ctx.fillStyle = c3;
  ctx.fillRect(x + s - 2, y, 2, s);
  ctx.fillRect(x, y + s - 2, s, 2);
}

function drawBackground() {
  // Night city sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f0f1a');
  g.addColorStop(0.55, '#1a1a2e');
  g.addColorStop(1, '#0d2818');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Distant block buildings
  const seed = 7;
  for (let i = 0; i < 12; i++) {
    const bx = ((i * 97 + seed) % Math.max(1, W)) - 20;
    const bw = 28 + (i % 4) * 10;
    const bh = 40 + ((i * 13) % 80);
    const by = H * 0.42 - bh;
    ctx.fillStyle = i % 3 === 0 ? '#2a2a3a' : '#1e2433';
    ctx.fillRect(bx, by, bw, bh);
    // Windows
    ctx.fillStyle = '#F4C430';
    for (let wy = by + 6; wy < by + bh - 8; wy += 10) {
      for (let wx = bx + 4; wx < bx + bw - 4; wx += 8) {
        if (((wx + wy + i) % 5) !== 0) ctx.fillRect(wx, wy, 3, 3);
      }
    }
  }

  // Street asphalt
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, H * 0.42, W, H);
  ctx.fillStyle = '#3a3a3a';
  for (let x = 0; x < W; x += 40) {
    ctx.fillRect(x, H * 0.42 + 8, 22, 3);
  }

  // Crates / barrels around table
  drawCrate(table.x - 28, table.y + table.h * 0.2, 22);
  drawCrate(table.x + table.w + 6, table.y + table.h * 0.55, 20);
  drawBarrel(table.x - 24, table.y + table.h * 0.7, 16);
  drawBarrel(table.x + table.w + 8, table.y + table.h * 0.15, 14);
}

function drawCrate(x, y, s) {
  drawBlock(x, y, s, '#8B5A2B', '#A8703A', '#5C3A1A');
  ctx.strokeStyle = '#5C3A1A';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 2); ctx.lineTo(x + s - 2, y + s - 2);
  ctx.moveTo(x + s - 2, y + 2); ctx.lineTo(x + 2, y + s - 2);
  ctx.stroke();
}

function drawBarrel(x, y, s) {
  ctx.fillStyle = '#6B4A2A';
  ctx.fillRect(x, y, s, s * 1.2);
  ctx.fillStyle = '#8B6A3A';
  ctx.fillRect(x, y + 2, s, 2);
  ctx.fillRect(x, y + s * 1.2 - 4, s, 2);
  ctx.fillStyle = '#444';
  ctx.fillRect(x - 1, y + 4, s + 2, 2);
  ctx.fillRect(x - 1, y + s, s + 2, 2);
}

function drawTable() {
  const rail = 14;
  // Outer dirt/stone rail
  for (let x = table.x - rail; x < table.x + table.w + rail; x += 12) {
    for (let y = table.y - rail; y < table.y; y += 12) {
      drawBlock(x, y, 12, '#5D9B3E', '#7CBF55', '#3D6B28');
    }
    for (let y = table.y + table.h; y < table.y + table.h + rail; y += 12) {
      drawBlock(x, y, 12, '#5D9B3E', '#7CBF55', '#3D6B28');
    }
  }
  for (let y = table.y; y < table.y + table.h; y += 12) {
    for (let x = table.x - rail; x < table.x; x += 12) {
      drawBlock(x, y, 12, '#8B5A2B', '#A8703A', '#5C3A1A');
    }
    for (let x = table.x + table.w; x < table.x + table.w + rail; x += 12) {
      drawBlock(x, y, 12, '#8B5A2B', '#A8703A', '#5C3A1A');
    }
  }

  // Felt — blocky grass pattern
  ctx.fillStyle = '#2E6B2E';
  ctx.fillRect(table.x, table.y, table.w, table.h);
  ctx.fillStyle = '#356F32';
  const cell = 16;
  for (let y = table.y; y < table.y + table.h; y += cell) {
    for (let x = table.x; x < table.x + table.w; x += cell) {
      if (((x + y) / cell) % 2 < 1) ctx.fillRect(x, y, cell, cell);
    }
  }
  // Subtle pixel noise
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  for (let i = 0; i < 40; i++) {
    const px = table.x + ((i * 47) % (table.w - 4));
    const py = table.y + ((i * 31) % (table.h - 4));
    ctx.fillRect(px, py, 2, 2);
  }

  // Pockets
  for (const p of pockets) {
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(p.x, p.y, POCKET_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(p.x, p.y, POCKET_R * 0.55, 0, Math.PI * 2);
    ctx.fill();
  }

  // Kitchen line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const kx = table.x + table.w * 0.35;
  ctx.beginPath();
  ctx.moveTo(kx, table.y + 4);
  ctx.lineTo(kx, table.y + table.h - 4);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawBall(b) {
  if (b.pocketed) return;
  const x = Math.round(b.x);
  const y = Math.round(b.y);
  const r = b.r;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - r + 2, y + r - 2, r * 2, 3);

  if (b.n === 0) {
    // Cue ball — white block
    ctx.fillStyle = '#F0F0F0';
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x - r, y - r, r * 2, 3);
    ctx.fillRect(x - r, y - r, 3, r * 2);
    ctx.fillStyle = '#AAAAAA';
    ctx.fillRect(x + r - 3, y - r, 3, r * 2);
    ctx.fillRect(x - r, y + r - 3, r * 2, 3);
    ctx.fillStyle = '#DDD';
    ctx.fillRect(x - 3, y - 3, 4, 4);
    return;
  }

  const col = BALL_COLORS[b.n] || '#888';
  if (b.stripe) {
    ctx.fillStyle = '#F5F5F5';
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.fillStyle = col;
    ctx.fillRect(x - r, y - r + 4, r * 2, r * 2 - 8);
  } else {
    ctx.fillStyle = col;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // Bevel
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x - r, y - r, r * 2, 2);
  ctx.fillRect(x - r, y - r, 2, r * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x + r - 2, y - r, 2, r * 2);
  ctx.fillRect(x - r, y + r - 2, r * 2, 2);

  // Number plate
  ctx.fillStyle = '#fff';
  ctx.fillRect(x - 4, y - 4, 8, 8);
  ctx.fillStyle = '#111';
  ctx.font = 'bold 7px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(b.n), x, y + 0.5);
}

function drawCue() {
  if (state !== 'aiming' && !(state === 'placing' && !cueBall.pocketed)) return;
  if (cueBall.pocketed) return;
  if (state === 'moving') return;

  const ang = aimAngle;
  const p = dragging || wearDrawing ? power : (wearDrawing ? wearPower : 0.25);
  const pull = 20 + p * 50;
  const tipX = cueBall.x - Math.cos(ang) * (BALL_R + 4 + pull * 0.15);
  const tipY = cueBall.y - Math.sin(ang) * (BALL_R + 4 + pull * 0.15);
  const buttX = tipX - Math.cos(ang) * (70 + pull);
  const buttY = tipY - Math.sin(ang) * (70 + pull);

  // Cue stick — blocky wood
  ctx.strokeStyle = '#8B5A2B';
  ctx.lineWidth = 5;
  ctx.lineCap = 'square';
  ctx.beginPath();
  ctx.moveTo(buttX, buttY);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  ctx.strokeStyle = '#D2B48C';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tipX - Math.cos(ang) * 20, tipY - Math.sin(ang) * 20);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  // Tip
  ctx.fillStyle = '#2277AA';
  ctx.fillRect(tipX - 2, tipY - 2, 4, 4);

  // Aim guideline
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 5]);
  ctx.beginPath();
  ctx.moveTo(cueBall.x + Math.cos(ang) * (BALL_R + 2), cueBall.y + Math.sin(ang) * (BALL_R + 2));
  ctx.lineTo(cueBall.x + Math.cos(ang) * 160, cueBall.y + Math.sin(ang) * 160);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ghost target
  const gx = cueBall.x + Math.cos(ang) * 90;
  const gy = cueBall.y + Math.sin(ang) * 90;
  ctx.strokeStyle = 'rgba(244,196,48,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(gx - 4, gy - 4, 8, 8);
}

function drawPlacingHint() {
  if (state !== 'placing') return;
  ctx.fillStyle = 'rgba(244,196,48,0.15)';
  ctx.fillRect(table.x, table.y, table.w * 0.35, table.h);
  ctx.fillStyle = '#F4C430';
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('点击放置母球', table.x + table.w * 0.175, table.y - 20);
}

// ── First-person perspective ─────────────────────────────
function fpsCam() {
  const eye = cueBall && !cueBall.pocketed ? cueBall : {
    x: table.x + table.w * 0.28,
    y: table.y + table.h * 0.5,
  };
  const dist = state === 'moving' ? 36 : 28;
  const yaw = aimAngle;
  return {
    x: eye.x - Math.cos(yaw) * dist,
    y: eye.y - Math.sin(yaw) * dist,
    z: 38,
    yaw,
    pitch: fpsPitch,
  };
}

function project3(wx, wy, wz, cam) {
  const dx = wx - cam.x;
  const dy = wy - cam.y;
  const dz = wz - cam.z;
  const cos = Math.cos(cam.yaw);
  const sin = Math.sin(cam.yaw);
  // Camera: +Z forward, +X right, +Y up
  let lx = -dx * sin + dy * cos;
  let ly = dz;
  let lz = dx * cos + dy * sin;
  const cp = Math.cos(cam.pitch);
  const sp = Math.sin(cam.pitch);
  const ly2 = ly * cp - lz * sp;
  const lz2 = ly * sp + lz * cp;
  if (lz2 < 4) return null;
  const fov = Math.min(W, H) * 0.95;
  return {
    x: W * 0.5 + (lx * fov) / lz2,
    y: H * 0.42 - (ly2 * fov) / lz2,
    z: lz2,
    s: fov / lz2,
  };
}

function fillPoly(pts, fill, stroke) {
  if (pts.length < 3 || pts.some((p) => !p)) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawQuad3(a, b, c, d, fill, stroke, cam) {
  fillPoly([project3(a.x, a.y, a.z, cam), project3(b.x, b.y, b.z, cam),
    project3(c.x, c.y, c.z, cam), project3(d.x, d.y, d.z, cam)], fill, stroke);
}

function drawFpsBackground(cam) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0a14');
  g.addColorStop(0.4, '#1a1a2e');
  g.addColorStop(0.55, '#243044');
  g.addColorStop(1, '#1a1510');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Block skyline strips (parallax by yaw)
  const shift = ((cam.yaw % (Math.PI * 2)) / (Math.PI * 2)) * 200;
  for (let i = 0; i < 16; i++) {
    const bx = ((i * 70 - shift * 3) % (W + 80)) - 40;
    const bh = 30 + ((i * 17) % 70);
    const by = H * 0.38 - bh;
    ctx.fillStyle = i % 2 ? '#22283a' : '#1a2030';
    ctx.fillRect(bx, by, 36 + (i % 3) * 8, bh);
    ctx.fillStyle = '#F4C430';
    for (let wy = by + 6; wy < by + bh - 6; wy += 10) {
      for (let wx = bx + 4; wx < bx + 30; wx += 8) {
        if (((wx + wy + i) % 4) !== 0) ctx.fillRect(wx, wy, 2, 2);
      }
    }
  }
}

function drawFpsGround(cam) {
  // Street plane far quad
  const span = Math.max(table.w, table.h) * 2.2;
  const cx = table.x + table.w / 2;
  const cy = table.y + table.h / 2;
  drawQuad3(
    { x: cx - span, y: cy - span, z: 0 },
    { x: cx + span, y: cy - span, z: 0 },
    { x: cx + span, y: cy + span, z: 0 },
    { x: cx - span, y: cy + span, z: 0 },
    '#2a2a2a', null, cam
  );
}

function drawFpsTable(cam) {
  const rail = 14;
  const zFelt = 8;
  const zRail = 18;
  const tx = table.x, ty = table.y, tw = table.w, th = table.h;

  // Outer rail tops (grass blocks)
  drawQuad3(
    { x: tx - rail, y: ty - rail, z: zRail },
    { x: tx + tw + rail, y: ty - rail, z: zRail },
    { x: tx + tw + rail, y: ty, z: zRail },
    { x: tx - rail, y: ty, z: zRail },
    '#5D9B3E', '#3D6B28', cam
  );
  drawQuad3(
    { x: tx - rail, y: ty + th, z: zRail },
    { x: tx + tw + rail, y: ty + th, z: zRail },
    { x: tx + tw + rail, y: ty + th + rail, z: zRail },
    { x: tx - rail, y: ty + th + rail, z: zRail },
    '#5D9B3E', '#3D6B28', cam
  );
  drawQuad3(
    { x: tx - rail, y: ty, z: zRail },
    { x: tx, y: ty, z: zRail },
    { x: tx, y: ty + th, z: zRail },
    { x: tx - rail, y: ty + th, z: zRail },
    '#8B5A2B', '#5C3A1A', cam
  );
  drawQuad3(
    { x: tx + tw, y: ty, z: zRail },
    { x: tx + tw + rail, y: ty, z: zRail },
    { x: tx + tw + rail, y: ty + th, z: zRail },
    { x: tx + tw, y: ty + th, z: zRail },
    '#8B5A2B', '#5C3A1A', cam
  );

  // Rail faces (vertical)
  drawQuad3(
    { x: tx - rail, y: ty - rail, z: 0 },
    { x: tx + tw + rail, y: ty - rail, z: 0 },
    { x: tx + tw + rail, y: ty - rail, z: zRail },
    { x: tx - rail, y: ty - rail, z: zRail },
    '#3D6B28', '#2A4A18', cam
  );

  // Felt
  drawQuad3(
    { x: tx, y: ty, z: zFelt },
    { x: tx + tw, y: ty, z: zFelt },
    { x: tx + tw, y: ty + th, z: zFelt },
    { x: tx, y: ty + th, z: zFelt },
    '#2E6B2E', '#1A4A1A', cam
  );

  // Checker felt tiles (adaptive density)
  const cell = W < 300 || H < 320 ? 28 : 18;
  for (let y = ty; y < ty + th; y += cell) {
    for (let x = tx; x < tx + tw; x += cell) {
      if (((x + y) / cell) % 2 >= 1) continue;
      const x2 = Math.min(x + cell, tx + tw);
      const y2 = Math.min(y + cell, ty + th);
      drawQuad3(
        { x, y, z: zFelt + 0.2 },
        { x: x2, y, z: zFelt + 0.2 },
        { x: x2, y: y2, z: zFelt + 0.2 },
        { x, y: y2, z: zFelt + 0.2 },
        '#356F32', null, cam
      );
    }
  }

  // Pockets
  for (const p of pockets) {
    const pr = project3(p.x, p.y, zFelt + 0.5, cam);
    if (!pr) continue;
    const r = Math.max(3, POCKET_R * pr.s * 0.9);
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Kitchen line
  const kx = tx + tw * 0.35;
  const a = project3(kx, ty + 4, zFelt + 0.4, cam);
  const b = project3(kx, ty + th - 4, zFelt + 0.4, cam);
  if (a && b) {
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawFpsBall(b, cam) {
  if (b.pocketed) return null;
  const zFelt = 8;
  const p = project3(b.x, b.y, zFelt + BALL_R, cam);
  if (!p || p.z < 6) return null;
  const r = Math.max(2, BALL_R * p.s);
  return { b, p, r };
}

function paintFpsBall(item) {
  const { b, p, r } = item;
  const x = p.x, y = p.y;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x - r, y + r * 0.55, r * 2, Math.max(2, r * 0.35));

  if (b.n === 0) {
    ctx.fillStyle = '#F0F0F0';
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - r, y - r, r * 2, Math.max(1, r * 0.25));
    ctx.fillStyle = '#aaa';
    ctx.fillRect(x + r - Math.max(1, r * 0.25), y - r, Math.max(1, r * 0.25), r * 2);
    return;
  }
  const col = BALL_COLORS[b.n] || '#888';
  if (b.stripe) {
    ctx.fillStyle = '#F5F5F5';
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.fillStyle = col;
    ctx.fillRect(x - r, y - r * 0.55, r * 2, r * 1.1);
  } else {
    ctx.fillStyle = col;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x - r, y - r, r * 2, Math.max(1, r * 0.2));
  if (r > 6) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 3, y - 3, 6, 6);
    ctx.fillStyle = '#111';
    ctx.font = `bold ${Math.max(5, Math.min(9, r * 0.7))}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(b.n), x, y + 0.5);
  }
}

function drawFpsCueOverlay() {
  if (state !== 'aiming' && state !== 'placing') return;
  if (!cueBall || cueBall.pocketed) return;
  const p = dragging || wearDrawing ? power : 0.2;
  const pull = p * 40;
  // Minecraft-style held cue from bottom-right into center
  const tipX = W * 0.5;
  const tipY = H * 0.42 + 8;
  const buttX = W * 0.72 + pull * 0.3;
  const buttY = H * 0.92 + pull * 0.4;
  ctx.strokeStyle = '#8B5A2B';
  ctx.lineWidth = 7;
  ctx.lineCap = 'square';
  ctx.beginPath();
  ctx.moveTo(buttX, buttY);
  ctx.lineTo(tipX, tipY + pull * 0.15);
  ctx.stroke();
  ctx.strokeStyle = '#D2B48C';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(W * 0.58 + pull * 0.1, H * 0.62 + pull * 0.2);
  ctx.lineTo(tipX, tipY + pull * 0.15);
  ctx.stroke();
  ctx.fillStyle = '#2277AA';
  ctx.fillRect(tipX - 3, tipY + pull * 0.15 - 3, 6, 6);

  // Aim ray
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(W * 0.5, H * 0.42);
  ctx.lineTo(W * 0.5, H * 0.22);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawFpsMinimap() {
  const mw = Math.min(88, W * 0.28);
  const mh = mw * (table.h / table.w);
  const mx = 10;
  const my = H - mh - Math.max(52, H * 0.12);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(mx - 3, my - 3, mw + 6, mh + 6);
  ctx.strokeStyle = '#555';
  ctx.strokeRect(mx - 3, my - 3, mw + 6, mh + 6);
  ctx.fillStyle = '#2E6B2E';
  ctx.fillRect(mx, my, mw, mh);
  const sx = mw / table.w;
  const sy = mh / table.h;
  for (const p of pockets) {
    ctx.fillStyle = '#111';
    ctx.fillRect(mx + (p.x - table.x) * sx - 2, my + (p.y - table.y) * sy - 2, 4, 4);
  }
  for (const b of balls) {
    if (b.pocketed) continue;
    ctx.fillStyle = b.n === 0 ? '#fff' : (BALL_COLORS[b.n] || '#888');
    ctx.fillRect(mx + (b.x - table.x) * sx - 1.5, my + (b.y - table.y) * sy - 1.5, 3, 3);
  }
  if (cueBall && !cueBall.pocketed) {
    const cx = mx + (cueBall.x - table.x) * sx;
    const cy = my + (cueBall.y - table.y) * sy;
    ctx.strokeStyle = '#F4C430';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(aimAngle) * 14, cy + Math.sin(aimAngle) * 14);
    ctx.stroke();
  }
}

function renderFps() {
  const cam = fpsCam();
  drawFpsBackground(cam);
  drawFpsGround(cam);
  drawFpsTable(cam);

  const items = [];
  for (const b of balls) {
    const item = drawFpsBall(b, cam);
    if (item) items.push(item);
  }
  items.sort((a, b) => b.p.z - a.p.z);
  for (const item of items) paintFpsBall(item);

  if (state === 'placing') {
    ctx.fillStyle = 'rgba(244,196,48,0.12)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#F4C430';
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('点击放置母球', W / 2, H * 0.18);
  }

  drawFpsCueOverlay();
  drawFpsMinimap();
}

function renderTop() {
  drawBackground();
  drawTable();
  drawPlacingHint();
  for (const b of balls) drawBall(b);
  drawCue();
}

function render() {
  if (viewMode === 'fps') renderFps();
  else renderTop();

  if (scratchFlash > 0) {
    scratchFlash--;
    ctx.fillStyle = `rgba(255,80,80,${scratchFlash / 120})`;
    ctx.fillRect(0, 0, W, H);
  }

  const ch = document.getElementById('crosshair');
  if (ch) ch.classList.toggle('show', viewMode === 'fps' && (state === 'aiming' || state === 'placing'));
}

// ── HUD ──────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score').textContent = String(score);
  document.getElementById('shots').textContent = String(shots);
  const pct = totalObject ? (pocketed / totalObject) * 100 : 0;
  document.getElementById('xp-fill').style.width = pct + '%';
  document.getElementById('xp-label').textContent =
    pocketed >= totalObject ? '清台!' : `进袋 ${pocketed}/${totalObject}`;
}

function buildHotbar() {
  const bar = document.getElementById('hotbar');
  bar.innerHTML = '';
  // Cue slot
  const cueSlot = document.createElement('div');
  cueSlot.className = 'slot active';
  cueSlot.innerHTML = `<div class="ball-icon" style="background:#fff"></div><span class="n">母</span>`;
  bar.appendChild(cueSlot);

  const remaining = balls.filter((b) => b.n > 0 && !b.pocketed).slice(0, 8);
  for (const b of remaining) {
    const s = document.createElement('div');
    s.className = 'slot';
    const col = BALL_COLORS[b.n];
    s.innerHTML = `<div class="ball-icon" style="background:${col}${b.stripe ? ';box-shadow:inset 0 0 0 2px #fff' : ''}"></div><span class="n">${b.n}</span>`;
    bar.appendChild(s);
  }
  // Empty filler to 9
  while (bar.children.length < 9) {
    const s = document.createElement('div');
    s.className = 'slot';
    bar.appendChild(s);
  }
}

// ── Input ────────────────────────────────────────────────
function pointerPos(e) {
  if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function onDown(e) {
  if (state === 'menu' || state === 'won') return;
  e.preventDefault();
  const p = pointerPos(e);

  if (state === 'placing') {
    if (viewMode === 'fps') {
      placeCueBall(table.x + table.w * 0.25, table.y + table.h * 0.5);
    } else {
      placeCueBall(p.x, p.y);
    }
    state = 'aiming';
    document.getElementById('aim-hint').classList.add('show');
    return;
  }

  if (state !== 'aiming') return;
  dragging = true;
  dragStart = p;
  dragAim0 = aimAngle;
  power = 0;
  document.getElementById('power-rail').classList.add('show');
  document.getElementById('aim-hint').classList.add('show');
}

function onMove(e) {
  if (!dragging || state !== 'aiming') return;
  e.preventDefault();
  const p = pointerPos(e);
  if (viewMode === 'fps') {
    // FPS: horizontal look, pull down to charge
    const dx = p.x - dragStart.x;
    const dy = p.y - dragStart.y;
    aimAngle = dragAim0 + dx * 0.008;
    power = clamp(Math.max(0, dy) / 140, 0, 1);
  } else {
    const dx = dragStart.x - p.x;
    const dy = dragStart.y - p.y;
    if (Math.hypot(dx, dy) > 4) aimAngle = Math.atan2(dy, dx);
    power = clamp(Math.hypot(dx, dy) / 140, 0, 1);
  }
  document.getElementById('power-fill').style.height = (power * 100) + '%';
}

function onUp(e) {
  if (!dragging || state !== 'aiming') return;
  e.preventDefault();
  dragging = false;
  if (power > 0.06) shoot(aimAngle, power);
  else {
    document.getElementById('power-rail').classList.remove('show');
  }
  power = 0;
  document.getElementById('power-fill').style.height = '0%';
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onUp);

function setViewMode(next) {
  viewMode = next === 'fps' ? 'fps' : 'top';
  const btn = document.getElementById('view-toggle');
  if (btn) {
    btn.textContent = viewMode === 'fps' ? '视角 · 第一人称' : '视角 · 俯视';
    btn.classList.toggle('fps', viewMode === 'fps');
  }
  const hint = document.getElementById('aim-hint');
  if (hint && state === 'aiming') {
    hint.textContent = viewMode === 'fps'
      ? '左右转视角 · 下拉蓄力出杆'
      : '拖拽瞄准 · 拉开蓄力';
  }
}

document.getElementById('view-toggle').onclick = (e) => {
  e.stopPropagation();
  setViewMode(viewMode === 'fps' ? 'top' : 'fps');
};

// Keyboard fallback
window.addEventListener('keydown', (e) => {
  if (e.key === 'v' || e.key === 'V') {
    setViewMode(viewMode === 'fps' ? 'top' : 'fps');
    return;
  }
  if (state !== 'aiming') return;
  if (e.key === 'ArrowLeft') aimAngle -= 0.05;
  if (e.key === 'ArrowRight') aimAngle += 0.05;
  if (e.key === 'ArrowUp') { power = clamp(power + 0.05, 0, 1); document.getElementById('power-rail').classList.add('show'); document.getElementById('power-fill').style.height = (power * 100) + '%'; }
  if (e.key === 'ArrowDown') { power = clamp(power - 0.05, 0, 1); document.getElementById('power-fill').style.height = (power * 100) + '%'; }
  if (e.key === ' ' || e.key === 'Enter') {
    if (power < 0.08) power = 0.45;
    shoot(aimAngle, power);
  }
});

// ── Wearable ─────────────────────────────────────────────
const wearable = new WearableInput({
  onGesture(name, detail) {
    if (state === 'placing' && name === 'release') {
      placeCueBall(table.x + table.w * 0.25, table.y + table.h * 0.5);
      state = 'aiming';
      return;
    }
    if (state !== 'aiming') return;
    if (name === 'aim' && detail) {
      wearAim = detail;
      aimAngle = Math.atan2(detail.y, detail.x);
      if (viewMode === 'fps') {
        fpsPitch = clamp(0.32 + detail.y * 0.1, 0.2, 0.62);
      }
    }
    if (name === 'draw' && detail) {
      wearDrawing = true;
      wearPower = clamp(detail.velocity ?? 0.4, 0.15, 1);
      power = wearPower;
      document.getElementById('power-rail').classList.add('show');
      document.getElementById('power-fill').style.height = (power * 100) + '%';
    }
    if (name === 'release' && detail) {
      const p = clamp(detail.velocity ?? wearPower, 0.2, 1);
      shoot(aimAngle, p);
    }
    if (name === 'cancel_draw') {
      wearDrawing = false;
      power = 0;
      document.getElementById('power-rail').classList.remove('show');
      document.getElementById('power-fill').style.height = '0%';
    }
  },
  onBadge(kind, text, active) {
    const el = document.getElementById(kind === 'ring' ? 'ring-badge' : 'cane-badge');
    if (!el) return;
    el.textContent = text;
    el.classList.toggle('on', active);
  },
});
wearable.setupRing();
wearable.setupCane();

// ── Game flow ────────────────────────────────────────────
function startGame(m) {
  mode = m;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('result').classList.remove('show');
  resize();
  rackBalls();
  state = 'aiming';
  aimAngle = 0;
  power = 0;
  setViewMode(viewMode);
  document.getElementById('aim-hint').classList.add('show');
  setTimeout(() => document.getElementById('aim-hint').classList.remove('show'), 2500);
}

function endGame(won) {
  state = 'won';
  document.getElementById('rtitle').textContent = won ? '清台完成!' : '对局结束';
  document.getElementById('r-shots').textContent = String(shots);
  document.getElementById('r-pockets').textContent = String(pocketed);
  document.getElementById('r-score').textContent = String(score);
  document.getElementById('result').classList.add('show');
}

document.getElementById('btn-start').onclick = () => startGame('street');
document.getElementById('btn-practice').onclick = () => startGame('practice');
document.getElementById('btn-again').onclick = () => startGame(mode);

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── Loop ─────────────────────────────────────────────────
function loop() {
  if (state === 'moving') {
    for (let i = 0; i < 2; i++) stepPhysics();
    if (!ballsMoving()) {
      if (cueBall.pocketed) {
        state = 'placing';
      } else if (pocketed >= totalObject) {
        score += Math.max(0, 100 - shots * 2);
        updateHUD();
        endGame(true);
      } else {
        state = 'aiming';
        document.getElementById('aim-hint').classList.add('show');
        setTimeout(() => document.getElementById('aim-hint').classList.remove('show'), 1500);
      }
    }
  }
  if (state !== 'menu') render();
  else {
    // Idle preview table on menu
    if (!balls.length) {
      resize();
      rackBalls();
    }
    render();
  }
  requestAnimationFrame(loop);
}

resize();
loop();
</script>
